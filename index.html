
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspen.Foodz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #183c2b;
      color: white;
      text-align: center;
      padding: 30px;
    }
    nav {
      background: #244d38;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 12px;
      text-decoration: none;
    }
    main {
      padding: 25px;
      text-align: center;
    }
    .product {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 300px;
      border-radius: 12px;
    }
    button {
      background: #183c2b;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aspen.Foodz</h1>
    <p>Fresh food. Great choices.</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#contact">Contact</a>
  </nav>

  <main id="home">
    <h2>Welcome to Aspen.Foodz!</h2>
    <p>Your food shopping experience starts here.</p>

    <section id="shop">
      <h2>Our Products</h2>
      <div class="product">
        <h3>Product 1</h3>
        <p>€2.00</p>
        <button onclick="alert('Coming soon!')">Buy now</button>
      </div>
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <p>Welcome to Aspen.Foodz!</p>
    </section>
  </main>
</body>
</html>
